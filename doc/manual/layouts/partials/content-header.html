{{- $version := getenv "HUGO_PUBLISHER_VERSION" | default "dev" -}}
<div id="content-header">
  <button id="hamburger" aria-label="Menü öffnen">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div id="content-header-version">
    <span class="version-box">Version {{ $version }}</span>
  </div>
  <a id="mobile-logo" href="{{ relLangURL "" }}">
    <img src="{{ "speedata.png" | relURL }}" alt="{{ site.Title }}" />
  </a>
</div>
